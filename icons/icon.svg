<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7a5f"/>
      <stop offset="1" stop-color="#1f5a44"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#g)"/>
  <!-- Tilted tissue roll icon -->
  <g transform="translate(256 256) rotate(-15) translate(-140 -140)">
    <ellipse cx="140" cy="40" rx="120" ry="36" fill="#ffffff" opacity="0.95"/>
    <rect x="20" y="40" width="240" height="200" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="140" cy="240" rx="120" ry="36" fill="#ffffff" opacity="0.95"/>
    <!-- perforation lines -->
    <line x1="40" y1="100" x2="240" y2="100" stroke="#2f7a5f" stroke-width="3" stroke-dasharray="4 6" opacity="0.6"/>
    <line x1="40" y1="140" x2="240" y2="140" stroke="#2f7a5f" stroke-width="3" stroke-dasharray="4 6" opacity="0.6"/>
    <line x1="40" y1="180" x2="240" y2="180" stroke="#2f7a5f" stroke-width="3" stroke-dasharray="4 6" opacity="0.6"/>
  </g>
  <!-- "PJ" label -->
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="4">PJ</text>
</svg>
